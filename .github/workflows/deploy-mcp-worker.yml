name: Deploy MCP Worker

on:
  push:
    branches: [main]
    paths:
      - "mcp-worker/**"
      - ".github/workflows/deploy-mcp-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing.
concurrency:
  group: mcp-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
