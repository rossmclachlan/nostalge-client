[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalge-mcp"
version = "0.1.0"
description = "MCP server: read the nostalge music library and build TIDAL playlists from it"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "tidalapi==0.8.11",
  "httpx>=0.28,<1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
